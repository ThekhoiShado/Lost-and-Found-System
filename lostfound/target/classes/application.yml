server:
  port: 8080
  servlet:
    session:
      timeout: 7200  # 管理端 session 超时（秒）

spring:
  application:
    name: lostfound

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/lost_found?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Thymeleaf 模板配置
  thymeleaf:
    cache: false  # 开发环境关闭缓存
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    servlet:
      content-type: text/html

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
    encoding:
      force: true
      enabled: true
      charset: UTF-8

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-prefix:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lostfound.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印SQL

# JWT 配置
jwt:
  secret: ${JWT_SECRET:ChangeMeToARandomString}
  expiration: 86400000  # token 过期时间（毫秒），默认24小时

# 文件上传路径
upload:
  local-path: ./uploads
  url-prefix: /uploads

# 验证码配置
verify-code:
  expire: 300  # 验证码有效期（秒），默认5分钟
  send-interval: 60  # 发送间隔（秒）
  length: 6  # 验证码长度

# 日志配置
logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
    com.mysql.cj.jdbc: DEBUG
