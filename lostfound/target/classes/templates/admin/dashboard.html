<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>控制台 - 失物招领管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root { --sidebar-width: 250px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #304156; z-index: 100; }
        .sidebar .logo { height: 60px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
        .sidebar .nav { padding: 10px 0; }
        .sidebar .nav a { display: flex; align-items: center; padding: 12px 20px; color: #bfcbd9; text-decoration: none; font-size: 14px; }
        .sidebar .nav a:hover, .sidebar .nav a.active { color: #fff; background: rgba(64,158,255,0.3); }
        .sidebar .nav a i { margin-right: 10px; font-size: 18px; }
        .sidebar .nav .section { padding: 15px 20px 5px; color: #8899aa; font-size: 12px; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: 60px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content { padding: 20px; }
        .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 15px; }
        .stat-card .icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
        .stat-card .value { font-size: 28px; font-weight: bold; }
        .stat-card .label { color: #999; font-size: 14px; }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <a class="logo" th:href="@{/admin/dashboard}"><i class="bi bi-search"></i>&nbsp; 失物招领管理</a>
        <div class="nav">
            <a th:href="@{/admin/dashboard}" class="active"><i class="bi bi-speedometer2"></i> 控制台首页</a>
            <div class="section">内容管理</div>
            <a th:href="@{/admin/lost/list}"><i class="bi bi-journal-text"></i> 失物/寻物管理</a>
            <a th:href="@{/admin/lost/audit}"><i class="bi bi-check-circle"></i> 发布审核</a>
            <div class="section">认领与互动</div>
            <a th:href="@{/admin/claim/list}"><i class="bi bi-file-earmark-text"></i> 认领申请</a>
            <a th:href="@{/admin/comment/list}"><i class="bi bi-chat-dots"></i> 评论维护</a>
            <div class="section">系统设置</div>
            <a th:href="@{/admin/user/list}"><i class="bi bi-people"></i> 用户管理</a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div>控制台首页</div>
            <div>
                <span th:text="${session.adminUser?.username}">管理员</span>
                <a th:href="@{/admin/logout}" class="btn btn-sm btn-outline-secondary ms-2">退出</a>
            </div>
        </div>
        <div class="content">
            <h5 class="mb-4">📊 系统概览</h5>
            <div class="row g-3">
                <!-- 统计卡片 -->
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="icon" style="background: #409eff;"><i class="bi bi-journal-text"></i></div>
                        <div><div class="value" id="stat-lost">-</div><div class="label">失物/寻物信息</div></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="icon" style="background: #67c23a;"><i class="bi bi-check-circle"></i></div>
                        <div><div class="value" id="stat-claim">-</div><div class="label">待审核认领</div></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="icon" style="background: #e6a23c;"><i class="bi bi-chat-dots"></i></div>
                        <div><div class="value" id="stat-comment">-</div><div class="label">评论总数</div></div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="icon" style="background: #909399;"><i class="bi bi-people"></i></div>
                        <div><div class="value" id="stat-user">-</div><div class="label">注册用户</div></div>
                    </div>
                </div>
            </div>

            <!-- 待审核发布列表 -->
            <div class="card mt-4">
                <div class="card-header"><strong>⏳ 待审核发布</strong></div>
                <div class="card-body">
                    <div id="pending-audit" class="text-muted">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 加载统计数据
        $.get('/admin/api/lost/list?current=1&size=1&status=0', function(res) {
            if (res.code === 200) $('#stat-lost').text(res.data.total + ' 条待审');
        });
        $.get('/admin/api/claim/list?current=1&size=1&status=0', function(res) {
            if (res.code === 200) $('#stat-claim').text(res.data.total + ' 条');
        });
        $.get('/admin/api/comment/list?current=1&size=1', function(res) {
            if (res.code === 200) $('#stat-comment').text(res.data.total + ' 条');
        });
        $.get('/admin/api/user/list?current=1&size=1', function(res) {
            if (res.code === 200) $('#stat-user').text(res.data.total + ' 人');
        });

        // 加载待审核列表
        $.get('/admin/api/lost/list?current=1&size=5&status=0', function(res) {
            if (res.code === 200 && res.data.records) {
                var html = '';
                if (res.data.records.length === 0) {
                    html = '<p class="text-success">🎉 暂无待审核信息</p>';
                } else {
                    html = '<table class="table table-sm"><thead><tr><th>标题</th><th>类型</th><th>时间</th><th>操作</th></tr></thead><tbody>';
                    res.data.records.forEach(function(item) {
                        html += '<tr><td>' + item.title + '</td><td>' + (item.type === 1 ? '失物招领' : '寻物启事') +
                                '</td><td>' + (item.createTime || '') + '</td>' +
                                '<td><a href="/admin/lost/audit" class="btn btn-sm btn-primary">去审核</a></td></tr>';
                    });
                    html += '</tbody></table>';
                }
                $('#pending-audit').html(html);
            }
        });
    </script>
</body>
</html>
