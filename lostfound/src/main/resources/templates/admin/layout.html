<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: '失物招领管理系统'">管理端</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root {
            --sidebar-width: 250px;
            --header-height: 60px;
            --primary: #409eff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }

        /* 侧边栏 */
        /* 侧边栏固定在页面左侧，宽度为250px，高度占满整个视口。背景色为深蓝色，文字颜色为浅灰色。包含一个顶部的logo区域和导航链接区域。导航链接有悬停和激活状态的样式。
        width: var(--sidebar-width)是使用CSS变量定义侧边栏的宽度，方便后续调整。transition: 0.3s使得侧边栏在显示和隐藏时有平滑的过渡效果。logo区域使用flex布局居中显示，导航链接使用块级元素显示，并且在悬停和激活状态下改变背景色和文字颜色以提供视觉反馈。
        */
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #304156; z-index: 100; transition: 0.3s; }
        .sidebar .logo { height: var(--header-height); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
        .sidebar .nav { padding: 10px 0; }
        .sidebar .nav a { display: block; padding: 12px 20px; color: #bfcbd9; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .sidebar .nav a:hover, .sidebar .nav a.active { color: #fff; background: rgba(64,158,255,0.3); }
        .sidebar .nav a i { display: inline-block; width: 22px; margin-right: 8px; font-size: 16px; text-align: center; vertical-align: middle; }
        .sidebar .nav .section { margin-top: 14px; padding: 10px 20px 6px; color: #f0a0c0; font-size: 13px; font-weight: 700; font-style: italic; letter-spacing: 1px; text-transform: uppercase; border-top: 1px solid #000; }

        /* 主内容区 */
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: var(--header-height); background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .topbar .user-info { display: flex; align-items: center; gap: 10px; }
        .content { padding: 20px; }

        /* 通用卡片 */
        .card { border: none; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card-header { background: #fff; border-bottom: 1px solid #ebeef5; padding: 15px 20px; border-radius: 8px 8px 0 0 !important; }

        /* 状态标签 */
        .badge-status-0 { background: #e6a23c; }
        .badge-status-1 { background: #67c23a; }
        .badge-status-2 { background: #909399; }
        .badge-status-3 { background: #f56c6c; }

        .page-item.active .page-link { background: var(--primary); border-color: var(--primary); }
        .page-link { color: var(--primary); }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <div class="sidebar">
        <a class="logo" th:href="@{/admin/dashboard}">
            <i class="bi bi-search"></i>&nbsp; 失物招领管理
        </a>
        <div class="nav">
            <a th:href="@{/admin/dashboard}" th:classappend="${currentPage == 'dashboard'} ? 'active'">
                <i class="bi bi-speedometer2"></i> 控制台首页
            </a>
            <div class="section">内容管理</div>
            <a th:href="@{/admin/lost/list}" th:classappend="${currentPage == 'lost'} ? 'active'">
                <i class="bi bi-journal-text"></i> 失物/寻物管理
            </a>
            <a th:href="@{/admin/lost/audit}" th:classappend="${currentPage == 'lost-audit'} ? 'active'">
                <i class="bi bi-check-circle"></i> 发布审核
            </a>
            <div class="section">认领与互动</div>
            <a th:href="@{/admin/claim/list}" th:classappend="${currentPage == 'claim'} ? 'active'">
                <i class="bi bi-file-earmark-text"></i> 认领申请
            </a>
            <a th:href="@{/admin/comment/list}" th:classappend="${currentPage == 'comment'} ? 'active'">
                <i class="bi bi-chat-dots"></i> 评论维护
            </a>
            <div class="section">系统设置</div>
            <a th:href="@{/admin/user/list}" th:classappend="${currentPage == 'user'} ? 'active'">
                <i class="bi bi-people"></i> 用户管理
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶栏 -->
        <div class="topbar">
            <div class="text-muted" th:text="${title} ?: ''"></div>
            <div class="user-info">
                <span th:text="${session.adminUser?.username}">管理员</span>
                <a th:href="@{/admin/logout}" class="btn btn-sm btn-outline-secondary">退出</a>
            </div>
        </div>
        <!-- 页面内容 -->
        <div class="content" th:insert="${content} ?: ~{}"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
