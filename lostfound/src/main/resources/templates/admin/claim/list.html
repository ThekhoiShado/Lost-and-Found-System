<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>认领申请管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root { --sidebar-width: 250px; } * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #304156; z-index: 100; }
        .sidebar .logo { height: 60px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
        .sidebar .nav { padding: 10px 0; } .sidebar .nav a { display: block; padding: 12px 20px; color: #bfcbd9; text-decoration: none; font-size: 14px; }
        .sidebar .nav a:hover, .sidebar .nav a.active { color: #fff; background: rgba(64,158,255,0.3); } .sidebar .nav a i { display: inline-block; width: 22px; margin-right: 8px; font-size: 16px; text-align: center; vertical-align: middle; }
        .sidebar .nav .section { margin-top: 14px; padding: 10px 20px 6px; color: #f0a0c0; font-size: 13px; font-weight: 700; font-style: italic; letter-spacing: 1px; border-top: 1px solid #000; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: 60px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content { padding: 20px; } .card { border: none; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <div class="sidebar">
        <a class="logo" th:href="@{/admin/dashboard}"><i class="bi bi-search"></i>&nbsp; 失物招领管理</a>
        <div class="nav">
            <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> 控制台首页</a>
            <div class="section">内容管理</div>
            <a th:href="@{/admin/lost/list}"><i class="bi bi-journal-text"></i> 失物/寻物管理</a>
            <a th:href="@{/admin/lost/audit}"><i class="bi bi-check-circle"></i> 发布审核</a>
            <div class="section">认领与互动</div>
            <a th:href="@{/admin/claim/list}" class="active"><i class="bi bi-file-earmark-text"></i> 认领申请</a>
            <a th:href="@{/admin/comment/list}"><i class="bi bi-chat-dots"></i> 评论维护</a>
            <div class="section">系统设置</div>
            <a th:href="@{/admin/user/list}"><i class="bi bi-people"></i> 用户管理</a>
        </div>
    </div>
    <div class="main-content">
        <div class="topbar"><div>认领申请管理</div><div><span th:text="${session.adminUser?.username}">管理员</span> <a href="/admin/logout" class="btn btn-sm btn-outline-secondary ms-2">退出</a></div></div>
        <div class="content">
            <div class="card">
                <div class="card-header d-flex justify-content-between"><strong>📋 认领申请列表</strong>
                    <div class="d-flex gap-2">
                        <select id="filter-status" class="form-select form-select-sm" style="width:130px">
                            <option value="">全部状态</option><option value="0">待审核</option><option value="1">已通过</option><option value="2">已拒绝</option>
                        </select>
                        <button class="btn btn-sm btn-primary" onclick="loadPage(1)">筛选</button>
                    </div>
                </div>
                <div class="card-body"><div id="table-container">加载中...</div><div id="pagination" class="mt-3"></div></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var cp = 1;
        function loadPage(p) { cp = p; var s = $('#filter-status').val(); $.get('/admin/api/claim/list', {current:p, size:10, status:s||undefined}, function(r) {
            if (r.code!==200) return; var d=r.data, h='<table class="table table-striped"><thead><tr><th>ID</th><th>失物ID</th><th>申请人</th><th>电话</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>';
            var sm={0:'待审核',1:'通过',2:'拒绝'}, bm={0:'warning',1:'success',2:'danger'};
            d.records.forEach(function(i){ h+='<tr><td>'+i.id+'</td><td>'+i.lostItemId+'</td><td>'+i.claimantName+'</td><td>'+i.claimantPhone+'</td><td><span class="badge bg-'+bm[i.status]+'">'+sm[i.status]+'</span></td><td>'+(i.createTime||'')+'</td><td>'+(i.status===0?'<a href="/admin/claim/audit?id='+i.id+'" class="btn btn-sm btn-primary">审核</a>':'<span class="text-muted">已处理</span>')+'</td></tr>'; });
            if(!d.records.length) h+='<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>';
            h+='</tbody></table>'; $('#table-container').html(h);
            var t=Math.ceil(d.total/d.size), pg=''; for(var i=1;i<=t;i++) pg+='<li class="page-item '+(i===cp?'active':'')+'"><a class="page-link" href="javascript:loadPage('+i+')">'+i+'</a></li>';
            $('#pagination').html('<nav><ul class="pagination pagination-sm">'+pg+'</ul></nav>');
        }); }
        $(function(){ loadPage(1); });
    </script>
</body>
</html>
