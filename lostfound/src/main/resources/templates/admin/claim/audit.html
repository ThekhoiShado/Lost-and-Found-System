<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>认领审核</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root { --sidebar-width: 250px; } * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #304156; }
        .sidebar .logo { height: 60px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
        .sidebar .nav { padding: 10px 0; } .sidebar .nav a { display: flex; align-items: center; padding: 12px 20px; color: #bfcbd9; text-decoration: none; font-size: 14px; }
        .sidebar .nav a:hover, .sidebar .nav a.active { color: #fff; background: rgba(64,158,255,0.3); } .sidebar .nav a i { margin-right: 10px; }
        .sidebar .nav .section { padding: 15px 20px 5px; color: #8899aa; font-size: 12px; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: 60px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content { padding: 20px; max-width: 900px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a class="logo" href="/admin/dashboard"><i class="bi bi-search"></i>&nbsp; 失物招领管理</a>
        <div class="nav">
            <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> 控制台首页</a>
            <div class="section">内容管理</div><a href="/admin/lost/list"><i class="bi bi-journal-text"></i> 失物/寻物管理</a><a href="/admin/lost/audit"><i class="bi bi-check-circle"></i> 发布审核</a>
            <div class="section">认领与互动</div><a href="/admin/claim/list" class="active"><i class="bi bi-file-earmark-text"></i> 认领申请</a><a href="/admin/comment/list"><i class="bi bi-chat-dots"></i> 评论维护</a>
            <div class="section">系统设置</div><a href="/admin/user/list"><i class="bi bi-people"></i> 用户管理</a>
        </div>
    </div>
    <div class="main-content">
        <div class="topbar"><div>认领审核</div><div><span th:text="${session.adminUser?.username}">管理员</span> <a href="/admin/logout" class="btn btn-sm btn-outline-secondary ms-2">退出</a></div></div>
        <div class="content">
            <div id="claim-detail" class="card p-4">请从认领列表中选择待审核的认领申请进行审核。</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 从URL参数获取认领ID
        var params = new URLSearchParams(window.location.search);
        var claimId = params.get('id');
        if (claimId) {
            $.get('/admin/api/claim/' + claimId, function(r) {
                if (r.code !== 200) { $('#claim-detail').html('<div class="alert alert-danger">认领申请不存在</div>'); return; }
                var c = r.data;
                $.get('/api/lost/' + c.lostItemId, function(lr) {
                    var lost = lr.code === 200 ? lr.data : null;
                    var html = '<h5>认领申请 #' + c.id + '</h5><hr>' +
                        '<p><strong>关联信息：</strong>' + (lost ? lost.title : '未知') + '</p>' +
                        '<p><strong>申请人：</strong>' + c.claimantName + ' | <strong>电话：</strong>' + c.claimantPhone + '</p>' +
                        '<p><strong>申请时间：</strong>' + (c.createTime||'') + '</p>' +
                        '<p><strong>当前状态：</strong> ' + ({0:'待审核',1:'已通过',2:'已拒绝'}[c.status]||'') + '</p>' +
                        '<div class="card bg-light p-3 mb-3"><strong>认领说明：</strong><br>' + c.claimDetail + '</div>';
                    if (c.status === 0) {
                        html += '<div class="mb-3"><label class="form-label">审核备注</label><textarea id="remark" class="form-control" rows="2" placeholder="可选"></textarea></div>' +
                            '<button class="btn btn-success me-2" onclick="doAudit(1)">✓ 通过</button>' +
                            '<button class="btn btn-danger" onclick="doAudit(2)">✗ 拒绝</button>';
                    } else if (c.auditRemark) {
                        html += '<div class="alert alert-secondary"><strong>审核备注：</strong>' + c.auditRemark + '</div>';
                    }
                    $('#claim-detail').html(html);
                });
            });
        }
        function doAudit(status) {
            var remark = $('#remark').val() || '';
            if (!confirm(status === 1 ? '确认通过此认领申请？通过后该失物将标记为"已认领"。' : '确认拒绝此认领申请？')) return;
            $.ajax({ url: '/admin/api/claim/audit/' + claimId, type: 'PUT', contentType: 'application/json',
                data: JSON.stringify({status: status, remark: remark}),
                success: function(r) { alert(r.msg); location.reload(); } });
        }
    </script>
</body>
</html>
