<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root { --sidebar-width: 250px; } * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #304156; }
        .sidebar .logo { height: 60px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
        .sidebar .nav { padding: 10px 0; } .sidebar .nav a { display: flex; align-items: center; padding: 12px 20px; color: #bfcbd9; text-decoration: none; font-size: 14px; }
        .sidebar .nav a:hover, .sidebar .nav a.active { color: #fff; background: rgba(64,158,255,0.3); } .sidebar .nav a i { margin-right: 10px; }
        .sidebar .nav .section { padding: 15px 20px 5px; color: #8899aa; font-size: 12px; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: 60px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content { padding: 20px; } .card { border: none; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
    </style>
</head>
<body>
    <div class="sidebar">
        <a class="logo" href="/admin/dashboard"><i class="bi bi-search"></i>&nbsp; 失物招领管理</a>
        <div class="nav">
            <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> 控制台首页</a>
            <div class="section">内容管理</div><a href="/admin/lost/list"><i class="bi bi-journal-text"></i> 失物/寻物管理</a><a href="/admin/lost/audit"><i class="bi bi-check-circle"></i> 发布审核</a>
            <div class="section">认领与互动</div><a href="/admin/claim/list"><i class="bi bi-file-earmark-text"></i> 认领申请</a><a href="/admin/comment/list"><i class="bi bi-chat-dots"></i> 评论维护</a>
            <div class="section">系统设置</div><a href="/admin/user/list" class="active"><i class="bi bi-people"></i> 用户管理</a>
        </div>
    </div>
    <div class="main-content">
        <div class="topbar"><div>用户管理</div><div><span th:text="${session.adminUser?.username}">管理员</span> <a href="/admin/logout" class="btn btn-sm btn-outline-secondary ms-2">退出</a></div></div>
        <div class="content">
            <div class="card">
                <div class="card-header d-flex"><strong>👥 用户列表</strong>
                    <input id="search" class="form-control form-control-sm ms-3" placeholder="搜索用户名/手机/邮箱" style="width:250px">
                    <button class="btn btn-sm btn-primary ms-2" onclick="loadPage(1)">搜索</button>
                </div>
                <div class="card-body"><div id="table">加载中...</div><div id="pager" class="mt-3"></div></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var cp = 1;
        function loadPage(p) { cp = p; $.get('/admin/api/user/list', {current:p, size:10, keyword:$('#search').val()||undefined}, function(r) {
            if (r.code!==200) return; var d=r.data, h='<table class="table table-striped"><thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>';
            d.records.forEach(function(u){ h+='<tr><td>'+u.id+'</td><td>'+u.username+'</td><td>'+(u.nickname||'')+'</td><td>'+(u.role==='admin'?'管理员':'用户')+'</td>'+
                '<td><span class="badge bg-'+(u.status===0?'success':'danger')+'">'+(u.status===0?'正常':'禁用')+'</span></td><td>'+(u.createTime||'')+'</td>'+
                '<td><button class="btn btn-sm '+(u.status===0?'btn-danger':'btn-success')+'" onclick="toggleStatus('+u.id+','+(u.status===0?1:0)+')">'+(u.status===0?'禁用':'启用')+'</button> '+
                '<a href="/admin/user/edit/'+u.id+'" class="btn btn-sm btn-info">编辑</a></td></tr>'; });
            if(!d.records.length) h+='<tr><td colspan="7" class="text-center text-muted">暂无用户</td></tr>';
            h+='</tbody></table>'; $('#table').html(h);
            var t=Math.ceil(d.total/d.size), pg=''; for(var i=1;i<=t;i++) pg+='<li class="page-item '+(i===cp?'active':'')+'"><a class="page-link" href="javascript:loadPage('+i+')">'+i+'</a></li>';
            $('#pager').html('<nav><ul class="pagination pagination-sm">'+pg+'</ul></nav>');
        }); }
        function toggleStatus(id, status) { if(!confirm('确定'+(status===1?'禁用':'启用')+'该用户？')) return;
            $.ajax({url:'/admin/api/user/status/'+id, type:'PUT', contentType:'application/json', data:JSON.stringify({status:status}), success:function(r){ alert(r.msg); loadPage(cp); }}); }
        $(function(){ loadPage(1); });
    </script>
</body>
</html>
