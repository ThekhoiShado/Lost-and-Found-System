<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"><title>编辑用户</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root { --sidebar-width: 250px; } * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #304156; }
        .sidebar .logo { height: 60px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); text-decoration: none; }
        .sidebar .nav { padding: 10px 0; } .sidebar .nav a { display: flex; align-items: center; padding: 12px 20px; color: #bfcbd9; text-decoration: none; font-size: 14px; }
        .sidebar .nav a:hover, .sidebar .nav a.active { color: #fff; background: rgba(64,158,255,0.3); } .sidebar .nav a i { margin-right: 10px; }
        .sidebar .nav .section { padding: 15px 20px 5px; color: #8899aa; font-size: 12px; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .topbar { height: 60px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .content { padding: 20px; max-width: 700px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a class="logo" href="/admin/dashboard"><i class="bi bi-search"></i>&nbsp; 失物招领管理</a>
        <div class="nav">
            <a href="/admin/dashboard"><i class="bi bi-speedometer2"></i> 控制台首页</a>
            <div class="section">内容管理</div><a href="/admin/lost/list"><i class="bi bi-journal-text"></i> 失物/寻物管理</a><a href="/admin/lost/audit"><i class="bi bi-check-circle"></i> 发布审核</a>
            <div class="section">认领与互动</div><a href="/admin/claim/list"><i class="bi bi-file-earmark-text"></i> 认领申请</a><a href="/admin/comment/list"><i class="bi bi-chat-dots"></i> 评论维护</a>
            <div class="section">系统设置</div><a href="/admin/user/list" class="active"><i class="bi bi-people"></i> 用户管理</a>
        </div>
    </div>
    <div class="main-content">
        <div class="topbar"><div>编辑用户</div><div><span th:text="${session.adminUser?.username}">管理员</span> <a href="/admin/logout" class="btn btn-sm btn-outline-secondary ms-2">退出</a></div></div>
        <div class="content">
            <div class="card p-4">
                <h5>编辑用户信息</h5>
                <div th:if="${editUser}">
                    <div class="mb-3"><label class="form-label">用户名</label><input class="form-control" th:value="${editUser.username}" readonly></div>
                    <div class="mb-3"><label class="form-label">昵称</label><input class="form-control" th:value="${editUser.nickname}" readonly></div>
                    <div class="mb-3"><label class="form-label">邮箱</label><input class="form-control" th:value="${editUser.email}" readonly></div>
                    <div class="mb-3"><label class="form-label">手机号</label><input class="form-control" th:value="${editUser.phone}" readonly></div>
                    <div class="mb-3"><label class="form-label">角色</label>
                        <select class="form-select" th:attr="data-id=${editUser.id}" disabled>
                            <option value="user" th:selected="${editUser.role == 'user'}">普通用户</option>
                            <option value="admin" th:selected="${editUser.role == 'admin'}">管理员</option>
                        </select>
                    </div>
                    <hr>
                    <h6>操作</h6>
                    <div>
                        <button class="btn btn-danger me-2" th:if="${editUser.status == 0}" onclick="toggleStatus([[${editUser.id}]], 1)">禁用该用户</button>
                        <button class="btn btn-success me-2" th:if="${editUser.status == 1}" onclick="toggleStatus([[${editUser.id}]], 0)">启用该用户</button>
                        <a href="/admin/user/list" class="btn btn-secondary">返回列表</a>
                    </div>
                </div>
                <div th:unless="${editUser}" class="alert alert-warning">用户不存在</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleStatus(id, status) {
            if (!confirm('确定' + (status === 1 ? '禁用' : '启用') + '该用户？')) return;
            $.ajax({ url: '/admin/api/user/status/' + id, type: 'PUT', contentType: 'application/json',
                data: JSON.stringify({ status: status }), success: function(r) { alert(r.msg); location.reload(); } });
        }
    </script>
</body>
</html>
